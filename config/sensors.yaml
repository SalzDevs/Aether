sensors:
  - id: 1
    name: temperature_sensor
    metrics:
      - name: temperature
        unit: C
        value: 22.5
      - name: humidity
        unit: "%"
        value: 45

  - id: 2
    name: pressure_sensor
    metrics:
      - name: pressure
        unit: hPa
        value: 1013.25

  - id: 3
    name: power_sensor
    metrics:
      - name: voltage
        unit: V
        value: 12.0
      - name: current
        unit: A
        value: 3.5

  - id: 4
    name: flow_sensor
    metrics:
      - name: flowRate
        unit: L/min
        value: 8.2

  - id: 5
    name: vibration_sensor
    metrics:
      - name: acceleration
        unit: m/s2
        value: 9.81
      - name: frequency
        unit: Hz
        value: 50
